name: Publish pi-computer-use Cua Perception

on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: cua-perception-publish
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            driver: darwin-universal
            runner: macos-15
          - target: linux-x64
            driver: linux-x64
            runner: ubuntu-22.04
          - target: win32-x64
            driver: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Driver system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-6 libxi6 libxtst6 libxext6 libwayland-client0 libxkbcommon0
      - name: Fetch pinned artifacts and verification runtime
        shell: bash
        run: |
          node packages/pi-computer-use/scripts/fetch-perception.mjs ${{ matrix.target }}
          node packages/pi-computer-use/scripts/fetch-driver.mjs ${{ matrix.driver }}
      - name: Verify signed install and pack
        shell: bash
        run: |
          set -euo pipefail
          package_dir="packages/pi-computer-use/platforms/cua-perception-${{ matrix.target }}"
          catalog="$(node -p "require('./packages/pi-computer-use/perception-release.json').targets['${{ matrix.target }}'].catalog")"
          case '${{ matrix.target }}' in
            darwin-*) driver='packages/pi-computer-use/platforms/cua-driver-darwin-universal/bin/CuaDriver.app/Contents/MacOS/cua-driver' ;;
            win32-*) driver='packages/pi-computer-use/platforms/cua-driver-win32-x64/bin/cua-driver.exe' ;;
            *) driver='packages/pi-computer-use/platforms/cua-driver-linux-x64/bin/cua-driver' ;;
          esac
          export CUA_DRIVER_RS_HOME="$RUNNER_TEMP/perception-verification"
          "$driver" extension inspect cua-perception --catalog "$package_dir/artifacts/$catalog"
          "$driver" extension install cua-perception --catalog "$package_dir/artifacts/$catalog"
          "$driver" extension status cua-perception --self-test
          npm pack "$package_dir" --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v7
        with:
          name: cua-perception-${{ matrix.target }}
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cua-perception-*
          path: .release-artifacts
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          for archive in .release-artifacts/*.tgz; do
            metadata="$(tar -xOf "$archive" package/package.json)"
            name="$(PACKAGE_JSON="$metadata" node -p 'JSON.parse(process.env.PACKAGE_JSON).name')"
            version="$(PACKAGE_JSON="$metadata" node -p 'JSON.parse(process.env.PACKAGE_JSON).version')"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              expected="$(PACKAGE_JSON="$metadata" node -p 'JSON.parse(process.env.PACKAGE_JSON).cuaPerceptionVersion')"
              published="$(npm view "${name}@${version}" cuaPerceptionVersion)"
              test "$published" = "$expected"
              echo "skip ${name}@${version} (already on npm)"
            else
              npm publish "$archive" --access public
            fi
          done
